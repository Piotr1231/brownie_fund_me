name: Fetch temporary Rupert narration

on:
  push:
    paths:
      - '.github/workflows/fetch_rupert_audio.yml'
  pull_request:
  workflow_dispatch:

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Download narration clips
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p narration
          urls=(
            'https://resource2.heygen.ai/text_to_speech/39c92843967641499ae5732c43f02ee8/03fcf8ecb0a94b6b94e9007edb7c35f8/id=97043288-3294-4481-97f5-aca0c042f0c6.wav'
            'https://resource2.heygen.ai/text_to_speech/39c92843967641499ae5732c43f02ee8/03fcf8ecb0a94b6b94e9007edb7c35f8/id=547f6ef2-222e-4628-8440-8971197826ad.wav'
            'https://resource2.heygen.ai/text_to_speech/39c92843967641499ae5732c43f02ee8/03fcf8ecb0a94b6b94e9007edb7c35f8/id=4f78241a-44e5-437e-abb9-a6dc890d8502.wav'
            'https://resource2.heygen.ai/text_to_speech/39c92843967641499ae5732c43f02ee8/03fcf8ecb0a94b6b94e9007edb7c35f8/id=303d4711-b22b-40c7-bcb4-fefab90a4149.wav'
            'https://resource2.heygen.ai/text_to_speech/39c92843967641499ae5732c43f02ee8/03fcf8ecb0a94b6b94e9007edb7c35f8/id=91555479-ac6e-4086-8dd0-dec92a39451d.wav'
            'https://resource2.heygen.ai/text_to_speech/39c92843967641499ae5732c43f02ee8/03fcf8ecb0a94b6b94e9007edb7c35f8/id=38d86fd2-f173-4a87-aaa0-457079885fb2.wav'
            'https://resource2.heygen.ai/text_to_speech/39c92843967641499ae5732c43f02ee8/03fcf8ecb0a94b6b94e9007edb7c35f8/id=2ee7a4d9-aad1-43a9-a962-a95464f83d84.wav'
            'https://resource2.heygen.ai/text_to_speech/39c92843967641499ae5732c43f02ee8/03fcf8ecb0a94b6b94e9007edb7c35f8/id=1851e13c-1d1d-4f11-a881-f9f35545810e.wav'
            'https://resource2.heygen.ai/text_to_speech/39c92843967641499ae5732c43f02ee8/03fcf8ecb0a94b6b94e9007edb7c35f8/id=13fb4c89-b5b9-4748-879d-a2813fa8ce77.wav'
            'https://resource2.heygen.ai/text_to_speech/39c92843967641499ae5732c43f02ee8/03fcf8ecb0a94b6b94e9007edb7c35f8/id=5a947bbb-7fae-46e2-bdf0-12bf6826f46f.wav'
          )
          i=1
          for url in "${urls[@]}"; do
            printf -v n '%02d' "$i"
            curl -L --fail --retry 3 --retry-delay 2 "$url" -o "narration/rupert_${n}.wav"
            test -s "narration/rupert_${n}.wav"
            i=$((i+1))
          done
          ls -lh narration

      - name: Upload narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: rupert-narration
          path: narration/*.wav
          if-no-files-found: error
          retention-days: 1
